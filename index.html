<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" href="data:,">
<title>OpenX — Open Source Lab</title>
<meta name="description" content="OpenX: an open-source lab. Twelve works and counting.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  color-scheme:light;
  --bg:#FFFFFF; --ink:#111110; --muted:#8a867e; --line:rgba(17,17,16,.14);
  --pill:#111110; --pill-ink:#FFFFFF;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111110; --ink:#FFFFFF; --muted:#8a867e; --line:rgba(255,255,255,.16);
  --pill:#FFFFFF; --pill-ink:#111110;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Geist","Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.display{font-family:"Dela Gothic One","Noto Sans TC",sans-serif}
/* topbar: logo left, menu center, pill right */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;padding:14px clamp(18px,4vw,44px);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tb-logo{font-family:"Dela Gothic One",sans-serif;font-size:17px}
.tb-mid{flex:1;display:flex;justify-content:center;gap:6px}
.tbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;font-size:13px;font-weight:700;border:1px solid transparent}
.tbtn:hover{border-color:var(--line)}
.tbtn svg{width:18px;height:18px}
.tbtn .moon{display:none}
html[data-theme="dark"] .tbtn .sun{display:none}
html[data-theme="dark"] .tbtn .moon{display:block}
.pill-btn{background:var(--pill);color:var(--pill-ink);font-size:13px;font-weight:600;padding:11px 22px;border-radius:999px;white-space:nowrap}
.pill-btn:hover{opacity:.85}
/* hamburger menu */
#menuBtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
#menuBtn:hover{border:1px solid var(--line)}
#menuBtn svg{width:22px;height:22px}
#menuPanel{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;padding:90px clamp(24px,7vw,90px) 40px;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .3s}
#menuPanel.open{opacity:1;pointer-events:auto}
#menuPanel .mp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
#menuPanel .mp-title{font-family:"Dela Gothic One",sans-serif;font-size:15px;letter-spacing:.06em}
#menuClose{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line)}
#menuClose svg{width:18px;height:18px}
.mp-item{display:flex;align-items:baseline;gap:18px;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mp-item .n{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.1em;flex:0 0 34px}
.mp-item .t{font-family:"Dela Gothic One","Noto Sans TC",sans-serif;font-size:clamp(24px,4.6vw,46px);line-height:1.1;transition:transform .25s}
.mp-item:hover .t{transform:translateX(10px)}
.mp-item .s{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.mp-foot{margin-top:30px;display:flex;gap:12px;align-items:center}
.mp-foot .lbl{font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-right:4px}
/* hero */
.hero{text-align:center;padding:clamp(110px,15vh,150px) 20px 8px;max-width:900px;margin:0 auto}
.hero h1{font-family:"Dela Gothic One",sans-serif;font-size:clamp(67px,9vw,135px);line-height:1.08;margin:0}
.hero .tag{margin:16px 0 0;color:var(--muted);font-size:clamp(13px,1.6vw,16px)}
/* curved strip — arch: center high, sides droop */
.strip{position:relative;height:clamp(360px,46vw,500px);margin-top:26px;overflow:hidden;touch-action:pan-y;cursor:grab}
.strip.grabbing{cursor:grabbing}
.scard{position:absolute;left:50%;top:10px;width:clamp(200px,24vw,300px);aspect-ratio:4/5;margin-left:calc(clamp(200px,24vw,300px)/-2);overflow:hidden;background:#eee;will-change:transform;user-select:none;-webkit-user-select:none}
.scard.snap{transition:transform .55s cubic-bezier(.22,.9,.28,1)}
.scard .cover-art,.scard img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.snav{position:absolute;top:42%;width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);display:grid;place-items:center;z-index:60}
.snav:hover{background:var(--pill);color:var(--pill-ink)}
.snav svg{width:17px;height:17px}
.snav.prev{left:clamp(8px,3vw,28px)}
.snav.next{right:clamp(8px,3vw,28px)}
/* below strip */
.below{text-align:center;max-width:640px;margin:0 auto;padding:26px 24px 10px}
.below .pname{font-family:"Dela Gothic One",sans-serif;font-size:clamp(22px,3.6vw,36px);margin:0}
.below .psub{color:var(--muted);font-size:14px;margin-top:6px}
.below .pdesc{color:var(--muted);font-size:14px;line-height:1.7;margin:12px 0 0}
.below .links{margin-top:20px;display:flex;gap:26px;justify-content:center;font-size:14px;font-weight:600}
.below .links a{border-bottom:1.5px solid var(--ink);padding-bottom:2px}
.below .links a:hover{opacity:.65}
.dots{display:flex;gap:7px;justify-content:center;margin:22px 0 4px;flex-wrap:wrap}
.dots button{width:7px;height:7px;border-radius:50%;background:var(--line);padding:0;transition:background .2s,transform .2s}
.dots button.on{background:var(--ink);transform:scale(1.4)}
.parts{display:flex;gap:10px;justify-content:center;margin:18px 0 6px;flex-wrap:wrap}
.parts button{padding:9px 22px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font-family:"Dela Gothic One",sans-serif;font-size:13px;letter-spacing:.04em;cursor:pointer;transition:all .2s}
.parts button.on{background:var(--ink);color:var(--bg,#fff);border-color:var(--ink)}
.parts button:hover{border-color:var(--ink)}
.mp-ph{font-family:"Dela Gothic One",sans-serif;font-size:13px;letter-spacing:.1em;color:var(--muted);padding:18px 0 6px;text-transform:uppercase}
footer{border-top:1px solid var(--line);margin-top:44px;padding:28px clamp(20px,5vw,56px);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;max-width:1180px;margin-left:auto;margin-right:auto}
footer .f-t{font-family:"Dela Gothic One",sans-serif;font-size:15px}
footer .f-s{font-size:12px;color:var(--muted);margin-top:5px}
footer .f-l{display:flex;gap:18px;font-size:13.5px;font-weight:600}
</style>
</head>

var STR={
en:{heroTitle:'Open<br>Source<br>Lab',tagline:'Fifteen works and counting — tools, toys and instruments, written in the open.',star:'mo',visit:'Visit',foot:'MIT-licensed, free forever.<br>Curated by X · a new piece every 3 days.'},
zh:{heroTitle:'開放<br>源碼<br>實驗室',tagline:'十五件作品，仲會繼續加——工具、玩具同樂器，全部公開寫成。',star:'mo',visit:'去玩',foot:'MIT 授權，永久免費。<br>X 策展 · 每 3 日一件新作。'}
};
function t(k){return STR[lang][k]||k;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

var strip=document.getElementById('strip'),track=document.getElementById('sctrack');
var cards=[],pos=0,N=PROJECTS.length,RAD=57.2958;
var PER=10,part=0;
function partsCount(){return Math.ceil(PROJECTS.length/PER);}
function VP(){return PROJECTS.slice(part*PER,part*PER+PER);}
function renderParts(){
  var el=document.getElementById('parts');el.innerHTML='';
  if(partsCount()<=1)return;
  for(var i=0;i<partsCount();i++){
    var b=document.createElement('button');
    b.textContent='Part '+(i+1);
    b.className=i===part?'on':'';
    (function(idx){b.addEventListener('click',function(){setPart(idx);});})(i);
    el.appendChild(b);
  }
}
function setPart(p){if(p===part)return;part=p;pos=0;build();}
function params(){
  var w=strip.offsetWidth;
  if(w>1000)return {gap:0.94,arch:64,tilt:0.55,vis:5.5};
  if(w>640)return {gap:0.96,arch:52,tilt:0.6,vis:4.2};
  return {gap:1.0,arch:44,tilt:0.65,vis:3.2};
}
var P=params();
function build(){
  track.innerHTML='';cards=[];
  var list=VP();N=list.length;
  list.forEach(function(p,i){
    var d=document.createElement('div');d.className='scard snap';
    d.innerHTML=p.art;
    track.appendChild(d);cards.push(d);
  });
  var dt=document.getElementById('dots');dt.innerHTML='';
  list.forEach(function(_,i){
    var b=document.createElement('button');b.setAttribute('aria-label','Go to '+(i+1));
    b.addEventListener('click',function(){go(i);});dt.appendChild(b);
  });
  renderParts();
  layout(true);
}
function layout(snap){
  var cw=cards[0].offsetWidth;
  cards.forEach(function(c,i){
    var d=i-pos;
    if(d>N/2)d-=N;else if(d<-N/2)d+=N;
    var ad=Math.abs(d);
    var a=d*0.42;
    var x=d*cw*P.gap;
    var y=(1-Math.cos(a))*P.arch;          /* arch: sides droop */
    var r=a*RAD*P.tilt;
    var s=1-Math.min(ad*0.07,0.28);
    c.classList.toggle('snap',!!snap);
    c.style.transform='translateX('+x.toFixed(1)+'px) translateY('+y.toFixed(1)+'px) rotate('+r.toFixed(2)+'deg) scale('+s.toFixed(3)+')';
    c.style.opacity=ad>P.vis?0:1;
    c.style.zIndex=String(100-Math.round(ad*10));
  });
  var ri=((Math.round(pos)%N)+N)%N;
  var p=VP()[ri];
  document.getElementById('pName').textContent=p.title[lang];
  document.getElementById('pSub').textContent=p.sub[lang];
  document.getElementById('pDesc').textContent=p.desc[lang];
  document.getElementById('pVisit').href=p.demo;
  Array.prototype.forEach.call(document.getElementById('dots').children,function(b,i){b.classList.toggle('on',i===ri);});
}
function go(i){pos=((Math.round(i)%N)+N)%N;layout(true);}
document.getElementById('sprev').addEventListener('click',function(e){e.stopPropagation();go(Math.round(pos)-1);});
document.getElementById('snext').addEventListener('click',function(e){e.stopPropagation();go(Math.round(pos)+1);});
document.addEventListener('keydown',function(e){
  var r=strip.getBoundingClientRect();
  if(r.bottom<0||r.top>innerHeight)return;
  if(e.key==='ArrowLeft')go(Math.round(pos)-1);
  if(e.key==='ArrowRight')go(Math.round(pos)+1);
});
var sx=null,dragging=false,moved=0,startPos=0;
strip.addEventListener('pointerdown',function(e){
  if(e.target.closest('.snav'))return;
  sx=e.clientX;dragging=true;moved=0;startPos=pos;strip.classList.add('grabbing');
  try{strip.setPointerCapture(e.pointerId);}catch(_){}
});
strip.addEventListener('pointermove',function(e){
  if(!dragging||sx===null)return;
  var dx=e.clientX-sx;moved=Math.max(moved,Math.abs(dx));
  var cw=cards[0].offsetWidth;
  pos=startPos-dx/(cw*1.8);
  layout(false);
});
function endDrag(e){
  if(!dragging)return;dragging=false;strip.classList.remove('grabbing');
  var dx=e?e.clientX-sx:0;sx=null;
  if(moved<8){   /* tap: centered card opens demo, others navigate */
    if(e){
      var el=document.elementFromPoint(e.clientX,e.clientY);
      var cel=el&&el.closest?el.closest('.scard'):null;
      if(cel){
        var ci=cards.indexOf(cel);
        if(ci>=0){
          if(Math.abs(ci-Math.round(pos))<0.5)window.open(VP()[ci].demo,'_blank','noopener');
          else go(ci);
        }
      }
    }
    layout(true);return;
  }
  var target=Math.round(pos);
  if(Math.abs(dx)>40)target=Math.round(pos)+(dx<0?1:-1);
  go(target);
}
strip.addEventListener('pointerup',endDrag);
strip.addEventListener('pointercancel',function(){dragging=false;strip.classList.remove('grabbing');sx=null;go(Math.round(pos));});
/* Magic Mouse / trackpad horizontal swipe -> wheel deltaX */
var wheelT=null;
strip.addEventListener('wheel',function(e){
  var ax=Math.abs(e.deltaX),ay=Math.abs(e.deltaY);
  if(ax>ay&&ax>2&&!dragging){
    e.preventDefault();
    var cw=cards[0].offsetWidth;
    pos+=e.deltaX/(cw*1.8);
    layout(false);
    clearTimeout(wheelT);
    wheelT=setTimeout(function(){go(Math.round(pos));},140);
  }
},{passive:false});
addEventListener('resize',function(){P=params();layout(true);});

var menuPanel=document.getElementById('menuPanel'),menuBtn=document.getElementById('menuBtn');
function buildMenu(){
  var html='';
  PROJECTS.forEach(function(p,i){
    if(i%PER===0&&partsCount()>1)html+='<div class="mp-ph">Part '+(Math.floor(i/PER)+1)+'</div>';
    var n=String(i+1).padStart(2,'0');
    html+='<div class="mp-item" data-i="'+i+'"><span class="n">'+n+'</span>'
      +'<span class="t">'+esc(p.title[lang])+'</span></div>';
  });
  document.getElementById('mpList').innerHTML=html;
  document.getElementById('mpList').querySelectorAll('.mp-item').forEach(function(el){
    el.addEventListener('click',function(){
      var gi=+el.getAttribute('data-i');
      closeMenu();setPart(Math.floor(gi/PER));go(gi%PER);
      document.getElementById('strip').scrollIntoView({behavior:'smooth',block:'center'});
    });
  });
}
function openMenu(){buildMenu();menuPanel.classList.add('open');menuPanel.setAttribute('aria-hidden','false');menuBtn.setAttribute('aria-expanded','true');document.body.style.overflow='hidden';}
function closeMenu(){menuPanel.classList.remove('open');menuPanel.setAttribute('aria-hidden','true');menuBtn.setAttribute('aria-expanded','false');document.body.style.overflow='';}
menuBtn.addEventListener('click',function(){menuPanel.classList.contains('open')?closeMenu():openMenu();});
document.getElementById('menuClose').addEventListener('click',closeMenu);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&menuPanel.classList.contains('open'))closeMenu();});
function applyLang(){
  root.setAttribute('data-lang',lang);root.setAttribute('lang',lang==='zh'?'zh-Hant':'en');
  document.querySelectorAll('[data-i18n]').forEach(function(el){var k=el.getAttribute('data-i18n');if(STR[lang][k])el.textContent=STR[lang][k];});
  document.querySelectorAll('[data-i18n-html]').forEach(function(el){var k=el.getAttribute('data-i18n-html');if(STR[lang][k])el.innerHTML=STR[lang][k];});
  document.getElementById('langToggle').textContent=lang==='zh'?'中':'EN';
  build();
  if(menuPanel.classList.contains('open'))buildMenu();
  try{localStorage.setItem('openx-lang',lang);}catch(e){}
}
document.getElementById('langToggle').addEventListener('click',function(){lang=lang==='en'?'zh':'en';applyLang();});
document.getElementById('themeToggle').addEventListener('click',function(){
  theme=root.getAttribute('data-theme')==='dark'?'light':'dark';
  root.setAttribute('data-theme',theme);
  try{localStorage.setItem('openx-theme',theme);}catch(e){}
});
applyLang();
})();
