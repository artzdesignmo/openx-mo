<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>OpenX — Open Source Lab</title>
<meta name="description" content="OpenX: an open-source lab. Eleven works and counting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Geist:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#FBFBF9; --ink:#111110; --muted:#8a867e; --line:rgba(17,17,16,.12);
  --card:#ffffff; --pill:#111110; --pill-ink:#FBFBF9;
  --shadow:0 24px 60px -24px rgba(17,17,16,.25);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111110; --ink:#FBFBF9; --muted:#8a867e; --line:rgba(251,251,249,.14);
  --card:#1b1b1a; --pill:#FBFBF9; --pill-ink:#111110;
  --shadow:0 24px 60px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Geist","Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.display{font-family:"Dela Gothic One","Noto Sans TC",sans-serif}
/* topbar — logo left, menu center, pill right */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;padding:14px clamp(18px,4vw,44px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tb-logo{font-family:"Dela Gothic One",sans-serif;font-size:17px}
.tb-mid{flex:1;display:flex;justify-content:center;gap:6px}
.tbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;font-size:13px;font-weight:700;border:1px solid transparent}
.tbtn:hover{border-color:var(--line)}
.tbtn svg{width:18px;height:18px}
.tbtn .moon{display:none}
html[data-theme="dark"] .tbtn .sun{display:none}
html[data-theme="dark"] .tbtn .moon{display:block}
.pill-btn{background:var(--pill);color:var(--pill-ink);font-size:13px;font-weight:600;padding:11px 22px;border-radius:999px;white-space:nowrap}
.pill-btn:hover{opacity:.85}
/* hero */
.hero{text-align:center;padding:130px 20px 10px;max-width:900px;margin:0 auto}
.hero h1{font-family:"Dela Gothic One",sans-serif;font-size:clamp(44px,8.5vw,104px);line-height:1.08;margin:0;letter-spacing:.01em}
.hero .tag{margin:18px 0 0;color:var(--muted);font-size:clamp(14px,1.8vw,17px)}
/* arc carousel */
.stage{position:relative;padding:34px 0 10px;perspective:1400px;overflow:hidden}
.track{display:flex;gap:clamp(10px,2vw,26px);justify-content:center;align-items:center;transform-style:preserve-3d;will-change:transform;padding:10px 0;cursor:grab}
.track.grabbing{cursor:grabbing}
.pcard{flex:0 0 clamp(220px,30vw,340px);aspect-ratio:4/4.6;border-radius:14px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);position:relative;transition:transform .45s cubic-bezier(.22,.8,.3,1),opacity .45s;user-select:none;-webkit-user-select:none}
.pcard .cover-art,.pcard img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.pcard .plabel{position:absolute;left:0;right:0;bottom:0;padding:26px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.62));color:#fff;font-family:"Dela Gothic One",sans-serif;font-size:15px;text-align:left}
/* nav arrows */
.nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;z-index:5}
.nav:hover{background:var(--pill);color:var(--pill-ink)}
.nav svg{width:18px;height:18px}
.nav.prev{left:clamp(8px,3vw,30px)}
.nav.next{right:clamp(8px,3vw,30px)}
/* placard */
.placard{text-align:center;max-width:640px;margin:26px auto 0;padding:0 24px}
.placard .idx{font-size:12px;letter-spacing:.3em;color:var(--muted);font-weight:600}
.placard h2{font-family:"Dela Gothic One",sans-serif;font-size:clamp(26px,4.5vw,44px);margin:10px 0 6px}
.placard .sub{color:var(--muted);font-size:15px;font-weight:500}
.placard .desc{margin:14px 0 0;font-size:15px;line-height:1.75;color:var(--muted)}
.placard .links{margin-top:22px;display:flex;gap:12px;justify-content:center}
.btn{min-width:150px;text-align:center;padding:13px 26px;border-radius:999px;font-size:14px;font-weight:600;border:1px solid var(--line)}
.btn.primary{background:var(--pill);color:var(--pill-ink);border-color:var(--pill)}
.btn:hover{opacity:.82}
.dots{display:flex;gap:8px;justify-content:center;margin:26px 0 10px;flex-wrap:wrap;max-width:520px;margin-left:auto;margin-right:auto}
.dots button{width:8px;height:8px;border-radius:50%;background:var(--line);padding:0;transition:background .2s,transform .2s}
.dots button.on{background:var(--ink);transform:scale(1.35)}
/* footer */
footer{margin-top:70px;border-top:1px solid var(--line);padding:36px clamp(20px,5vw,48px);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;max-width:1200px;margin-left:auto;margin-right:auto}
footer .f-t{font-family:"Dela Gothic One",sans-serif;font-size:16px}
footer .f-s{font-size:12.5px;color:var(--muted);margin-top:6px}
footer .f-l{display:flex;gap:18px;font-size:14px;font-weight:600}
.hintline{text-align:center;color:var(--muted);font-size:12px;margin-top:8px;letter-spacing:.06em}
</style>
</head>
<body>
<header class="topbar">
  <a class="tb-logo display" href="#top">↗ OPENX</a>
  <div class="tb-mid">

    <button class="tbtn" id="themeToggle" aria-label="theme">

<section class="hero" id="top">
  <h1 class="display" data-i18n="heroTitle">Open Source<br>Lab</h1>

</section>

<section class="stage" id="stage">

  <button class="nav next" id="nextBtn" aria-label="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
</section>
<p class="hintline" data-i18n="hint">Drag or swipe to browse</p>

<section class="placard" id="placard">
  <div class="idx"><b id="plNum">01</b> / <span id="plTotal">11</span></div>
  <h2 class="display" id="plTitle"></h2>
  <div class="sub" id="plSub"></div>
  <p class="desc" id="plDesc"></p>
  <div class="links">
    <a class="btn primary" id="plVisit" href="#" target="_blank" rel="noopener"><span data-i18n="visit">Visit</span> →</a>
    <a class="btn" id="plGh" href="#" target="_blank" rel="noopener">GitHub</a>
  </div>
  <div class="dots" id="dots"></div>
</section>

<footer>
  <div><div class="f-t display">OPENX</div><div class="f-s" data-i18n-html="foot">MIT-licensed, free forever.<br>Curated by X · a new piece every 3 days.</div></div>

</footer>

var STR={
  en:{heroTitle:'Open Source<br>Lab',tagline:'Eleven works and counting — tools, toys and instruments, written in the open.',hint:'Drag or swipe to browse',star:'Star on GitHub',visit:'Visit',foot:'MIT-licensed, free forever.<br>Curated by X · a new piece every 3 days.'},
  zh:{heroTitle:'開放源碼<br>實驗室',tagline:'十一件作品，仲會繼續加——工具、玩具同樂器，全部公開寫成。',hint:'左右撥動瀏覽',star:'去 GitHub 俾星',visit:'去玩',foot:'MIT 授權，永久免費。<br>X 策展 · 每 3 日一件新作。'}
};
function t(k){return STR[lang][k]||k;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

var track=document.getElementById('track');
var idx=0,N=PROJECTS.length;
var cards=[];

// build cards
PROJECTS.forEach(function(p,i){
  var d=document.createElement('div');d.className='pcard';
  d.innerHTML='<div style="position:absolute;inset:0">'+p.art+'</div><div class="plabel">'+esc(p.title.en)+'</div>';
  d.addEventListener('click',function(){go(i);});
  track.appendChild(d);cards.push(d);
});
// dots
var dotsEl=document.getElementById('dots');
PROJECTS.forEach(function(_,i){
  var b=document.createElement('button');b.setAttribute('aria-label','Go to '+(i+1));
  b.addEventListener('click',function(){go(i);});dotsEl.appendChild(b);
});

function layout(){
  var cw=cards[0].offsetWidth,gap=parseFloat(getComputedStyle(track).gap)||20;
  cards.forEach(function(c,i){
    var d=i-idx;
    // wrap distance for infinite feel (no wrap, clamp)
    var ad=Math.abs(d);
    var s=1-Math.min(ad*0.13,0.5);
    var z=-Math.min(ad*160,480);
    var r=d* -9;
    var o=ad>2?0:1;
    c.style.transform='translateZ('+z+'px) rotateY('+r+'deg) scale('+s+')';
    c.style.opacity=o;
    c.style.zIndex=String(100-ad);
    c.style.pointerEvents=ad>2?'none':'auto';
  });
  // center the track on idx
  var off=idx*(cw+gap);
  track.style.transform='translateX('+(-off)+'px)';
  // placard
  var p=PROJECTS[idx];
  document.getElementById('plNum').textContent=String(idx+1).padStart(2,'0');
  document.getElementById('plTotal').textContent=N;
  document.getElementById('plTitle').textContent=p.title[lang];
  document.getElementById('plSub').textContent=p.sub[lang];
  document.getElementById('plDesc').textContent=p.desc[lang];
  document.getElementById('plVisit').href=p.demo;
  document.getElementById('plGh').href=p.github;
  Array.prototype.forEach.call(dotsEl.children,function(b,i){b.classList.toggle('on',i===idx);});
}
function go(i){
  idx=Math.max(0,Math.min(N-1,i));
  layout();
}
// arrows
document.getElementById('prevBtn').addEventListener('click',function(){go(idx-1);});
document.getElementById('nextBtn').addEventListener('click',function(){go(idx+1);});
// drag / swipe
var sx=null,dx0=0,dragging=false;
track.addEventListener('pointerdown',function(e){sx=e.clientX;dragging=true;track.classList.add('grabbing');try{track.setPointerCapture(e.pointerId);}catch(_){}});
track.addEventListener('pointermove',function(e){
  if(!dragging||sx===null)return;
  dx0=e.clientX-sx;
  var cw=cards[0].offsetWidth,gap=parseFloat(getComputedStyle(track).gap)||20;
  var off=idx*(cw+gap)-dx0;
  track.style.transform='translateX('+(-off)+'px)';
});
function endDrag(){
  if(!dragging)return;dragging=false;track.classList.remove('grabbing');
  var cw=cards[0].offsetWidth,gap=parseFloat(getComputedStyle(track).gap)||20;
  var step=Math.round(dx0/(cw+gap));
  sx=null;dx0=0;go(idx-step);
}
track.addEventListener('pointerup',endDrag);
track.addEventListener('pointercancel',endDrag);
// keyboard
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft')go(idx-1);
  if(e.key==='ArrowRight')go(idx+1);
});
addEventListener('resize',layout);

function applyLang(){
  root.setAttribute('data-lang',lang);root.setAttribute('lang',lang==='zh'?'zh-Hant':'en');
  document.querySelectorAll('[data-i18n]').forEach(function(el){var k=el.getAttribute('data-i18n');if(STR[lang][k])el.textContent=STR[lang][k];});
  document.querySelectorAll('[data-i18n-html]').forEach(function(el){var k=el.getAttribute('data-i18n-html');if(STR[lang][k])el.innerHTML=STR[lang][k];});
  var ht=STR[lang].heroTitle;document.querySelector('.hero h1').innerHTML=ht;
  document.getElementById('langToggle').textContent=lang==='zh'?'中':'EN';
  layout();
  try{localStorage.setItem('openx-lang',lang);}catch(e){}
}
document.getElementById('langToggle').addEventListener('click',function(){lang=lang==='en'?'zh':'en';applyLang();});
document.getElementById('themeToggle').addEventListener('click',function(){
  theme=root.getAttribute('data-theme')==='dark'?'light':'dark';
  root.setAttribute('data-theme',theme);
  try{localStorage.setItem('openx-theme',theme);}catch(e){}
});
applyLang();
})();
</script>
